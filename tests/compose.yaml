services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /work
    volumes:
      - ..:/work:ro
    environment:
      ODT_TEST_DB_HOST: db
      PYTHONPATH: /work
    depends_on:
      db:
        condition: service_healthy
