name: Test Local Docker Minimal

on:
  push:
  pull_request:

jobs:
  docker-local-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify uv
        run: uv --version

      - name: Create workspace root folder
        run: mkdir -p odoo-workspace

      - name: Initialize project and generate default local Docker artifacts
        working-directory: ./odoo-workspace
        run: |
          uv run odt-env --init-project --sync-addons --set odoo:version=18.0

      - name: Check generated local Docker artifacts
        run: |
          test -f odoo-workspace/compose.yaml
          test -f odoo-workspace/docker/local/Dockerfile
          test -f odoo-workspace/docker/local/.dockerignore
          test -f odoo-workspace/docker/local/configs/odoo.conf
          test -f odoo-workspace/docker/local/requirements/addons-requirements.lock.txt

          test ! -e odoo-workspace/docker/local/addons
          test ! -e odoo-workspace/docker/deploy
          ! grep -q '^COPY addons/' odoo-workspace/docker/local/Dockerfile

          cd odoo-workspace
          docker compose config --quiet

      - name: Build local Docker image with Compose
        working-directory: ./odoo-workspace
        run: docker compose build odoo

      - name: Start the PostgreSQL service
        working-directory: ./odoo-workspace
        run: docker compose up -d db

      - name: Init database with fleet addon
        working-directory: ./odoo-workspace
        run: |
          docker compose run --rm odoo \
            -- \
            -c /etc/odoo/odoo.conf \
            -d odoo \
            -i fleet \
            --without-demo=all \
            --stop-after-init

      - name: Verify fleet addon installed
        working-directory: ./odoo-workspace
        run: |
          docker compose exec -T db psql -U odoo -d odoo -c \
            "SELECT name, state
             FROM ir_module_module
             WHERE name = 'fleet';"

          missing="$(docker compose exec -T db psql -U odoo -d odoo -tAc \
            "SELECT string_agg(name, ',')
             FROM ir_module_module
             WHERE name = 'fleet'
               AND state <> 'installed';")"

          test -z "${missing}"

      - name: Stop Docker Compose services
        if: always()
        working-directory: ./odoo-workspace
        run: docker compose down -v --remove-orphans

      - name: Show generated local Docker workspace and config
        if: always()
        run: |
          echo "Workspace tree:"
          find odoo-workspace -maxdepth 4 | sort
          echo
          echo "Docker Compose:"
          cat odoo-workspace/compose.yaml || true
          echo
          echo "Local Dockerfile:"
          cat odoo-workspace/docker/local/Dockerfile || true
          echo
          echo "Local Docker Odoo config:"
          cat odoo-workspace/docker/local/configs/odoo.conf || true
          echo
          echo "Docker images:"
          docker images || true
          echo
          echo "Docker Compose logs:"
          cd odoo-workspace && docker compose logs --no-color || true
