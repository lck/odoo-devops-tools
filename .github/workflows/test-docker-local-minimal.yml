name: Test Local Docker Minimal

on:
  push:
  pull_request:

jobs:
  docker-local-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify uv
        run: uv --version

      - name: Create workspace root folder
        run: mkdir -p odoo-workspace

      - name: Initialize project and generate default local Docker artifacts
        working-directory: ./odoo-workspace
        run: |
          uv run odoo-compose --init --sync-addons --set odoo:version=18.0 --set docker:mailpit=true --set docker:mailpit_webui_port=18025

      - name: Check generated local Docker artifacts
        run: |
          test -f odoo-workspace/compose.yaml
          test -f odoo-workspace/docker/local/Dockerfile
          test -f odoo-workspace/docker/local/.dockerignore
          test -f odoo-workspace/docker/local/configs/odoo.conf
          test -f odoo-workspace/docker/local/requirements/all-requirements.in.txt
          test -x odoo-workspace/docker/local/scripts/run.sh
          test -x odoo-workspace/docker/local/scripts/shell.sh
          test -x odoo-workspace/docker/local/scripts/update.sh
          test -x odoo-workspace/docker/local/scripts/backup-db.sh
          test -x odoo-workspace/docker/local/scripts/restore-db.sh
          test -x odoo-workspace/docker/local/scripts/neutralize-db.sh
          test -x odoo-workspace/docker/local/scripts/backup-filestore.sh
          test -x odoo-workspace/docker/local/scripts/restore-filestore.sh
          test -x odoo-workspace/docker/local/scripts/restic.sh
          test -x odoo-workspace/docker/local/scripts/backup-filestore-restic.sh
          test -x odoo-workspace/docker/local/scripts/restore-filestore-restic.sh
          test ! -e odoo-workspace/docker/local/requirements/all-requirements.lock.txt
          grep -q 'uv pip compile .*all-requirements.in.txt' odoo-workspace/docker/local/Dockerfile
          grep -q 'uv pip install .*all-requirements.lock.txt' odoo-workspace/docker/local/Dockerfile
          grep -q 'COPY --from=restic/restic:.* /usr/bin/restic /usr/bin/restic' odoo-workspace/docker/local/Dockerfile

          test "$(grep -c '^      driver: local$' odoo-workspace/compose.yaml)" -eq 2
          grep -q '^        max-size: "50m"$' odoo-workspace/compose.yaml
          grep -q '^        max-file: "10"$' odoo-workspace/compose.yaml
          grep -Fq '  mailpit:' odoo-workspace/compose.yaml
          grep -Fq 'image: ghcr.io/axllent/mailpit:v1.31.3' odoo-workspace/compose.yaml
          grep -Fq 'MP_DATABASE: /data/mailpit.db' odoo-workspace/compose.yaml
          grep -Fq 'MP_DISABLE_VERSION_CHECK: "true"' odoo-workspace/compose.yaml
          grep -Fq 'MP_POP3_BIND_ADDR: "0.0.0.0:1110"' odoo-workspace/compose.yaml
          grep -Fq 'MP_POP3_AUTH: "odoo:odoo"' odoo-workspace/compose.yaml
          grep -Fq '"18025:8025"' odoo-workspace/compose.yaml
          grep -Fq 'mailpit-data:/data' odoo-workspace/compose.yaml
          grep -Fq '  mailpit-data:' odoo-workspace/compose.yaml
          grep -Fq 'smtp_server = mailpit' odoo-workspace/docker/local/configs/odoo.conf
          grep -Fq 'smtp_port = 1025' odoo-workspace/docker/local/configs/odoo.conf
          grep -Fq 'smtp_ssl = False' odoo-workspace/docker/local/configs/odoo.conf
          grep -Fq 'smtp_user = False' odoo-workspace/docker/local/configs/odoo.conf
          grep -Fq 'smtp_password = False' odoo-workspace/docker/local/configs/odoo.conf

          test ! -e odoo-workspace/docker/local/addons
          test ! -e odoo-workspace/docker/deploy
          ! grep -q '^COPY addons/' odoo-workspace/docker/local/Dockerfile

          cd odoo-workspace
          docker compose config --quiet

      - name: Check legacy neutralization helper generation
        run: |
          mkdir -p odoo-workspace-legacy
          cd odoo-workspace-legacy
          uv run odoo-compose --init --set odoo:version=15.0
          test -x docker/local/scripts/neutralize-db.sh
          grep -Fq "Using legacy minimal neutralization for Odoo 15." docker/local/scripts/neutralize-db.sh
          grep -Fq -- "--entrypoint click-odoo odoo" docker/local/scripts/neutralize-db.sh
          grep -Fq '"ir.cron", "ir.mail_server", "fetchmail.server"' docker/local/scripts/neutralize-db.sh

      - name: Build local Docker image with Compose
        working-directory: ./odoo-workspace
        run: docker compose build odoo

      - name: Verify restic is installed in the local Docker image
        working-directory: ./odoo-workspace
        run: docker compose run --rm --no-deps --entrypoint restic odoo version

      - name: Start the PostgreSQL service
        working-directory: ./odoo-workspace
        run: docker compose up -d db

      - name: Init database with generated run helper
        working-directory: ./odoo-workspace
        run: |
          ./docker/local/scripts/run.sh \
            -i fleet \
            --without-demo=all \
            --stop-after-init

      - name: Test Docker shell and update helpers
        working-directory: ./odoo-workspace
        run: |
          printf 'print(env.cr.dbname)\n' | ./docker/local/scripts/shell.sh > shell-output.log
          grep -Fq "odoo" shell-output.log

          ./docker/local/scripts/update.sh --help > update-help.log 2>&1
          grep -Fq "Usage:" update-help.log

      - name: Test Mailpit SMTP, POP3 and persistence
        working-directory: ./odoo-workspace
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused \
            http://localhost:18025/readyz

          docker compose run --rm --no-deps --entrypoint python3 odoo -c '
          import smtplib
          from email.message import EmailMessage

          message = EmailMessage()
          message["From"] = "odoo@example.test"
          message["To"] = "customer@example.test"
          message["Subject"] = "odoo-compose Mailpit SMTP test"
          message.set_content("Mailpit SMTP integration test")

          with smtplib.SMTP("mailpit", 1025) as smtp:
              smtp.send_message(message)
          '

          curl --fail --silent --show-error \
            http://localhost:18025/api/v1/messages \
            | grep -Fq 'odoo-compose Mailpit SMTP test'

          docker compose run --rm --no-deps --entrypoint python3 odoo -c '
          import poplib

          pop = poplib.POP3("mailpit", 1110)
          pop.user("odoo")
          pop.pass_("odoo")
          count, _ = pop.stat()
          assert count >= 1, "Mailpit POP3 inbox is empty"
          pop.quit()
          '

          docker compose restart mailpit

          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused \
            http://localhost:18025/readyz

          curl --fail --silent --show-error \
            http://localhost:18025/api/v1/messages \
            | grep -Fq 'odoo-compose Mailpit SMTP test'

      - name: Verify fleet addon installed
        working-directory: ./odoo-workspace
        run: |
          docker compose exec -T db psql -U odoo -d odoo -c \
            "SELECT name, state
             FROM ir_module_module
             WHERE name = 'fleet';"

          missing="$(docker compose exec -T db psql -U odoo -d odoo -tAc \
            "SELECT string_agg(name, ',')
             FROM ir_module_module
             WHERE name = 'fleet'
               AND state <> 'installed';")"

          test -z "${missing}"

      - name: Create a filestore marker
        working-directory: ./odoo-workspace
        run: |
          docker compose run --rm --no-deps --entrypoint sh odoo -c \
            'mkdir -p /var/lib/odoo/filestore/odoo && printf %s streaming-backup-test > /var/lib/odoo/filestore/odoo/odoo-compose-test.txt'

      - name: Back up database and filestore with generated helpers
        working-directory: ./odoo-workspace
        run: |
          ./docker/local/scripts/backup-db.sh ./odoo-backups/test.dump
          ./docker/local/scripts/backup-filestore.sh ./odoo-backups/test-filestore.tar.gz
          test -s ./odoo-backups/test.dump
          test -s ./odoo-backups/test-filestore.tar.gz

      - name: Restore database and filestore independently
        working-directory: ./odoo-workspace
        run: |
          source_uuid="$(docker compose exec -T db psql -U odoo -d odoo -tAc \
            "SELECT value FROM ir_config_parameter WHERE key = 'database.uuid';")"
          test -n "${source_uuid}"

          ODOO_DB_NAME=odoo_restore \
            ./docker/local/scripts/restore-db.sh ./odoo-backups/test.dump
          ODOO_DB_NAME=odoo_move \
            ./docker/local/scripts/restore-db.sh --move ./odoo-backups/test.dump
          ODOO_DB_NAME=odoo_restore \
            ./docker/local/scripts/restore-filestore.sh ./odoo-backups/test-filestore.tar.gz

          copy_uuid="$(docker compose exec -T db psql -U odoo -d odoo_restore -tAc \
            "SELECT value FROM ir_config_parameter WHERE key = 'database.uuid';")"
          move_uuid="$(docker compose exec -T db psql -U odoo -d odoo_move -tAc \
            "SELECT value FROM ir_config_parameter WHERE key = 'database.uuid';")"

          test -n "${copy_uuid}"
          test "${copy_uuid}" != "${source_uuid}"
          test "${move_uuid}" = "${source_uuid}"

      - name: Neutralize restored database
        working-directory: ./odoo-workspace
        run: |
          ODOO_DB_NAME=odoo_restore \
            ./docker/local/scripts/neutralize-db.sh \
            2>&1 | tee neutralize-db.log

          grep -Fq "INFO: Using native Odoo neutralization for Odoo 18." neutralize-db.log
          grep -Fq "Neutralization finished" neutralize-db.log
          grep -Fq "INFO: Database neutralization completed: odoo_restore" neutralize-db.log

      - name: Require force when restoring existing database or filestore
        working-directory: ./odoo-workspace
        run: |
          set +e
          db_output="$(ODOO_DB_NAME=odoo_restore \
            ./docker/local/scripts/restore-db.sh ./odoo-backups/test.dump 2>&1)"
          db_status=$?
          fs_output="$(ODOO_DB_NAME=odoo_restore \
            ./docker/local/scripts/restore-filestore.sh ./odoo-backups/test-filestore.tar.gz 2>&1)"
          fs_status=$?
          set -e

          test "${db_status}" -ne 0
          grep -Fq "target database 'odoo_restore' already exists. Use --force to replace it." <<< "${db_output}"

          test "${fs_status}" -ne 0
          grep -Fq "target filestore for database 'odoo_restore' already exists. Use --force to replace it." <<< "${fs_output}"

          ODOO_DB_NAME=odoo_restore \
            ./docker/local/scripts/restore-db.sh --force ./odoo-backups/test.dump
          ODOO_DB_NAME=odoo_restore \
            ./docker/local/scripts/restore-filestore.sh ./odoo-backups/test-filestore.tar.gz --force

      - name: Back up and restore filestore with restic
        working-directory: ./odoo-workspace
        env:
          RESTIC_REPOSITORY: ${{ github.workspace }}/odoo-workspace/restic-test-repo
          RESTIC_PASSWORD: test-restic-password
          RESTIC_HOST: odoo-compose-ci
        run: |
          ./docker/local/scripts/restic.sh init

          RESTIC_BACKUP_ID=ci-test \
            ./docker/local/scripts/backup-filestore-restic.sh

          ./docker/local/scripts/restic.sh snapshots \
            --host odoo-compose-ci \
            --path /var/lib/odoo/filestore/odoo \
            --tag filestore

          ODOO_DB_NAME=odoo_restic_restore \
          RESTIC_SOURCE_DB_NAME=odoo \
            ./docker/local/scripts/restore-filestore-restic.sh latest

          set +e
          restic_output="$(ODOO_DB_NAME=odoo_restic_restore \
            RESTIC_SOURCE_DB_NAME=odoo \
            ./docker/local/scripts/restore-filestore-restic.sh latest 2>&1)"
          restic_status=$?
          set -e

          test "${restic_status}" -ne 0
          grep -Fq "target filestore for database 'odoo_restic_restore' already exists. Use --force to replace it." <<< "${restic_output}"

          ODOO_DB_NAME=odoo_restic_restore \
          RESTIC_SOURCE_DB_NAME=odoo \
            ./docker/local/scripts/restore-filestore-restic.sh latest --force

      - name: Verify restored database and filestore
        working-directory: ./odoo-workspace
        run: |
          missing="$(docker compose exec -T db psql -U odoo -d odoo_restore -tAc \
            "SELECT string_agg(name, ',')
             FROM ir_module_module
             WHERE name = 'fleet'
               AND state <> 'installed';")"
          test -z "${missing}"

          docker compose run --rm --no-deps --entrypoint sh odoo -c \
            'test "$(cat /var/lib/odoo/filestore/odoo_restore/odoo-compose-test.txt)" = streaming-backup-test'

          docker compose run --rm --no-deps --entrypoint sh odoo -c \
            'test "$(cat /var/lib/odoo/filestore/odoo_restic_restore/odoo-compose-test.txt)" = streaming-backup-test'

      - name: Stop Docker Compose services
        if: always()
        working-directory: ./odoo-workspace
        run: docker compose down -v --remove-orphans

      - name: Show generated local Docker workspace and config
        if: always()
        run: |
          echo "Workspace tree:"
          find odoo-workspace -maxdepth 4 | sort
          echo
          echo "Docker Compose:"
          cat odoo-workspace/compose.yaml || true
          echo
          echo "Local Dockerfile:"
          cat odoo-workspace/docker/local/Dockerfile || true
          echo
          echo "Local Docker Odoo config:"
          cat odoo-workspace/docker/local/configs/odoo.conf || true
          echo
          echo "Docker images:"
          docker images || true
          echo
          echo "Docker Compose logs:"
          cd odoo-workspace && docker compose logs --no-color || true
