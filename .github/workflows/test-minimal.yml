name: Test Create Workspace Minimal

on:
  push:
  pull_request:

jobs:
  odoo-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install Odoo system requirements
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            postgresql-client \
            build-essential \
            libffi-dev \
            libjpeg-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify uv
        run: uv --version

      - name: Reject duplicate workspace root options
        shell: bash
        run: |
          set +e
          uv run odt-env --init-project ./init-project-root --root ./explicit-root \
            > duplicate-root.log 2>&1
          status=$?
          set -e

          cat duplicate-root.log
          test "$status" -ne 0
          grep -F "workspace ROOT was specified both as --init-project ROOT and --root" duplicate-root.log
          test ! -e init-project-root
          test ! -e explicit-root

      - name: Check backward-compatible init-project with --root
        shell: bash
        run: |
          uv run odt-env --init-project --root ./legacy-init-workspace \
            --no-local-docker \
            --no-configs \
            --no-scripts \
            --no-data-dir \
            --no-provisioning-log

          test -f legacy-init-workspace/odoo-project.ini
          rm -rf legacy-init-workspace

      - name: Provision Odoo workspace with init-project ROOT shorthand
        env:
          ODT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          uv run odt-env --init-project ./odoo-workspace --sync-all --create-venv \
            --set odoo:version=19.0 \
            --set config:db_host=127.0.0.1 \
            --set config:db_port=5432 \
            --set config:db_name=odoo \
            --set config:db_user=odoo \
            --set config:db_password=odoo

      - name: Check installed Odoo version
        working-directory: odoo-workspace
        run: |
          ./venv/bin/python - <<'PY'
          import odoo.release

          version = odoo.release.version
          print(f"Installed Odoo version: {version}")

          if not version.startswith("19.0"):
              raise SystemExit(f"Expected Odoo 19.0, got {version}")
          PY

      - name: Check generated scripts
        run: |
          test -x odoo-workspace/odoo-scripts/run.sh
          ls -la odoo-workspace/odoo-scripts

      - name: Init database
        working-directory: odoo-workspace
        run: ./odoo-scripts/run.sh --stop-after-init

      - name: Update addons
        working-directory: odoo-workspace
        run: ./odoo-scripts/update.sh

      - name: Show generated workspace
        if: always()
        run: |
          echo "Workspace tree:"
          find odoo-workspace -maxdepth 2 | sort
          echo
          echo "Configs:"
          ls -la odoo-workspace/odoo-configs || true
          echo
          echo "Odoo config odoo-server.conf:"
          cat odoo-workspace/odoo-configs/odoo-server.conf || true
