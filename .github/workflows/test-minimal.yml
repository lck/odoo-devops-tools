name: Test Create Workspace Minimal

on:
  push:
  pull_request:

jobs:
  odoo-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Git 2.54+ can background-maintain .git/shallow during branch switches.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install Odoo system requirements
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            postgresql-client-16 \
            restic \
            build-essential \
            libffi-dev \
            libjpeg-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify uv
        run: uv --version

      - name: Reject unsafe Git addon destinations
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Reject traversal and platform-specific path/command metacharacters.
          for name in '..' '../outside' 'nested/repo' 'nested\repo' 'C:drive' 'repo&other'; do
            printf '[odoo]\nversion = 19.0\n[addons.%s]\nrepo = https://example.invalid/addon.git\nbranch = 19.0\n' \
              "$name" > "$tmp/unsafe.ini"
            if uv run odoo-compose-venv "$tmp/unsafe.ini" --root "$tmp/workspace" \
              --no-provisioning-log > "$tmp/rejected.log" 2>&1; then
              echo "Unsafe addon name was accepted: $name"
              exit 1
            fi
            grep -Fq 'Invalid addon section name' "$tmp/rejected.log" || {
              cat "$tmp/rejected.log"
              exit 1
            }
          done

          # A safe section name must not follow an implicit symlink outside addons_root.
          mkdir -p "$tmp/workspace/odoo-addons" "$tmp/external-repo"
          ln -s "$tmp/external-repo" "$tmp/workspace/odoo-addons/safe-name"
          printf '[odoo]\nversion = 19.0\n[addons.safe-name]\nrepo = https://example.invalid/addon.git\nbranch = 19.0\n' \
            > "$tmp/symlink.ini"
          if uv run odoo-compose-venv "$tmp/symlink.ini" --root "$tmp/workspace" \
            --no-provisioning-log > "$tmp/rejected.log" 2>&1; then
            echo 'Implicit addon symlink outside workspace was accepted.'
            exit 1
          fi
          grep -Fq 'Unsafe addon destination' "$tmp/rejected.log"
          test ! -e "$tmp/external-repo/.git"

          # An explicit local path outside the workspace remains supported.
          printf '[odoo]\nversion = 19.0\n[addons.safe-name]\npath = %s\n' \
            "$tmp/external-repo" > "$tmp/local.ini"
          uv run odoo-compose-venv "$tmp/local.ini" --root "$tmp/workspace" --no-provisioning-log
          grep -Fq "$tmp/external-repo" "$tmp/workspace/odoo-configs/odoo-server.conf"

      - name: Check generated db_name and runtime PostgreSQL environment
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          first="$tmp/first/shared"
          second="$tmp/second/shared"
          mkdir -p "$first" "$second" "$tmp/docker-only" "$tmp/explicit"

          # Two same-named workspaces must receive different stable names.
          for root in "$first" "$second"; do
            printf '[odoo]\nversion = 19.0\n\n[config]\n# keep this comment\n' > "$root/odoo-project.ini"
            uv run odoo-compose-venv --root "$root" --no-provisioning-log
            test ! -d "$root/venv"
            grep -Fqx '# keep this comment' "$root/odoo-project.ini"
          done
          name="$(sed -n 's/^db_name = //p' "$first/odoo-project.ini")"
          other="$(sed -n 's/^db_name = //p' "$second/odoo-project.ini")"
          [[ "$name" =~ ^shared_[0-9a-f]{10}$ ]]
          [[ "$other" =~ ^shared_[0-9a-f]{10}$ ]]
          test "$name" != "$other"
          grep -Fqx "db_name = $name" "$first/odoo-configs/odoo-server.conf"
          grep -Fqx "DB_NAME=$name" "$first/odoo-scripts/backup-db.sh"

          # Missing connection keys must not override PG* at script execution.
          ! grep -Eq '^export PG(HOST|PORT|USER|PASSWORD)=' "$first/odoo-scripts/backup-db.sh"
          mkdir -p "$tmp/bin"
          cat > "$tmp/bin/pg_dump" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "${PGHOST:-}" "${PGPORT:-}" "${PGUSER:-}" \
            "${PGPASSWORD:-}" "${@: -1}" > "$PG_CAPTURE"
          printf 'mock dump\n'
          SH
          chmod +x "$tmp/bin/pg_dump"
          PG_CAPTURE="$tmp/pg-env" POSTGRES_BIN="$tmp/bin" \
            PGHOST=127.0.0.9 PGPORT=6543 PGUSER=ci_user PGPASSWORD=ci_password \
            "$first/odoo-scripts/backup-db.sh" "$tmp/db.dump"
          printf '127.0.0.9\n6543\nci_user\nci_password\n%s\n' "$name" > "$tmp/expected-pg-env"
          cmp "$tmp/expected-pg-env" "$tmp/pg-env"
          grep -Fqx 'mock dump' "$tmp/db.dump"

          # Re-running and moving a workspace must preserve the stored db_name.
          cp "$first/odoo-project.ini" "$tmp/original.ini"
          uv run odoo-compose-venv --root "$first" --no-provisioning-log
          cmp "$tmp/original.ini" "$first/odoo-project.ini"
          mv "$first" "$tmp/first/moved"
          uv run odoo-compose-venv --root "$tmp/first/moved" --no-provisioning-log
          grep -Fqx "db_name = $name" "$tmp/first/moved/odoo-project.ini"

          # Explicit names win; Docker-only workspaces retain the 'odoo' default.
          printf '[odoo]\nversion = 19.0\n[config]\ndb_name = manual_db\n' > "$tmp/explicit/odoo-project.ini"
          uv run odoo-compose-venv --root "$tmp/explicit" --no-provisioning-log
          grep -Fqx 'db_name = manual_db' "$tmp/explicit/odoo-project.ini"
          printf '[odoo]\nversion = 19.0\n' > "$tmp/docker-only/odoo-project.ini"
          uv run odoo-compose --root "$tmp/docker-only" --no-provisioning-log
          ! grep -q '^db_name' "$tmp/docker-only/odoo-project.ini"
          grep -Fqx 'DB_NAME=odoo' "$tmp/docker-only/docker/local/scripts/backup-db.sh"
          uv run odoo-compose --root "$tmp/first/moved" --no-provisioning-log
          grep -Fqx "DB_NAME=$name" "$tmp/first/moved/docker/local/scripts/backup-db.sh"

          # External INI sources must remain unchanged across generation.
          printf '[odoo]\nversion = 19.0\n' > "$tmp/external.ini"
          mkdir -p "$tmp/external-root"
          uv run odoo-compose-venv "$tmp/external.ini" --root "$tmp/external-root" --no-provisioning-log
          ! grep -q '^db_name' "$tmp/external.ini"
          external_name="$(sed -n 's/^db_name = //p' "$tmp/external-root/odoo-project.ini")"
          test -n "$external_name"
          uv run odoo-compose-venv "$tmp/external.ini" --root "$tmp/external-root" --no-provisioning-log
          grep -Fqx "db_name = $external_name" "$tmp/external-root/odoo-project.ini"

      - name: Verify native filestore helpers use custom data_dir
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          root="$tmp/custom-workspace"
          data="$tmp/custom data & files"
          mkdir -p "$root" "$data/filestore/ci_custom"
          cat > "$root/odoo-project.ini" <<EOF
          [odoo]
          version = 19.0
          [config]
          db_name = ci_custom
          data_dir = $data
          EOF
          uv run odoo-compose-venv --root "$root" --no-provisioning-log
          grep -Fqx "data_dir = $data" "$root/odoo-configs/odoo-server.conf"
          printf 'original' > "$data/filestore/ci_custom/attachment"
          "$root/odoo-scripts/backup-filestore.sh" "$tmp/filestore.tar.gz"
          printf 'changed' > "$data/filestore/ci_custom/attachment"
          "$root/odoo-scripts/restore-filestore.sh" --force "$tmp/filestore.tar.gz"
          test "$(cat "$data/filestore/ci_custom/attachment")" = original
          test ! -e "$root/odoo-data/filestore/ci_custom"

          export RESTIC_REPOSITORY="$tmp/restic-repo"
          export RESTIC_PASSWORD=ci-filestore-password
          export RESTIC_HOST=ci-custom
          export RESTIC_BIN="$(command -v restic)"
          "$root/odoo-scripts/restic.sh" init
          "$root/odoo-scripts/backup-filestore-restic.sh"
          uv run odoo-compose-venv --root "$root" --no-provisioning-log \
            --set config:db_name=ci_restored
          RESTIC_SOURCE_DB_NAME=ci_custom "$root/odoo-scripts/restore-filestore-restic.sh"
          test "$(cat "$data/filestore/ci_restored/attachment")" = original
          test ! -e "$root/odoo-data/filestore/ci_restored"

          # A data_dir inside the workspace must continue to work after moving it.
          portable="$tmp/portable workspace"
          mkdir -p "$portable"
          printf '[odoo]\nversion = 19.0\n[config]\ndb_name = portable_db\ndata_dir = custom-data\n' \
            > "$portable/odoo-project.ini"
          uv run odoo-compose-venv --root "$portable" --no-provisioning-log
          mkdir -p "$portable/custom-data/filestore/portable_db"
          printf 'portable' > "$portable/custom-data/filestore/portable_db/attachment"
          mv "$portable" "$tmp/moved workspace"
          "$tmp/moved workspace/odoo-scripts/backup-filestore.sh" "$tmp/portable.tar.gz"
          tar -xOzf "$tmp/portable.tar.gz" ./attachment | grep -Fqx portable

      - name: Reject duplicate workspace root options
        shell: bash
        run: |
          set +e
          uv run odoo-compose --init ./init-project-root --root ./explicit-root \
            > duplicate-root.log 2>&1
          status=$?
          set -e

          cat duplicate-root.log
          test "$status" -ne 0
          grep -F "workspace ROOT was specified both as --init ROOT and --root" duplicate-root.log
          test ! -e init-project-root
          test ! -e explicit-root

      - name: Provision Odoo workspace with --init ROOT shorthand
        env:
          ODT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          uv run odoo-compose-venv --init ./odoo-workspace --sync-all --create-venv \
            --set odoo:version=19.0 \
            --set config:db_host=127.0.0.1 \
            --set config:db_port=5432 \
            --set config:db_name=odoo \
            --set config:db_user=odoo \
            --set config:db_password=odoo

      - name: Check installed Odoo version
        working-directory: odoo-workspace
        run: |
          ./venv/bin/python - <<'PY'
          import odoo.release

          version = odoo.release.version
          print(f"Installed Odoo version: {version}")

          if not version.startswith("19.0"):
              raise SystemExit(f"Expected Odoo 19.0, got {version}")
          PY

      - name: Check generated scripts
        run: |
          test -x odoo-workspace/odoo-scripts/run.sh
          for helper in backup-db restore-db neutralize-db backup-filestore \
            restore-filestore restic backup-filestore-restic restore-filestore-restic; do
            test -x "odoo-workspace/odoo-scripts/${helper}.sh"
          done
          ls -la odoo-workspace/odoo-scripts

      - name: Init database
        working-directory: odoo-workspace
        run: ./odoo-scripts/run.sh --stop-after-init

      - name: Update addons
        working-directory: odoo-workspace
        run: ./odoo-scripts/update.sh

      - name: Back up native database and filestore
        working-directory: odoo-workspace
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          psql -d odoo -v ON_ERROR_STOP=1 -c "UPDATE ir_config_parameter SET value='test-source-identity' WHERE key='database.uuid';"
          mkdir -p odoo-data/filestore/odoo
          printf '%s' 'native-filestore-test' > odoo-data/filestore/odoo/attachment
          export POSTGRES_BIN=/usr/lib/postgresql/16/bin
          ./odoo-scripts/backup-db.sh ./odoo-backups/native.dump
          ./odoo-scripts/backup-filestore.sh ./odoo-backups/native-filestore.tar.gz
          pg_restore --list ./odoo-backups/native.dump >/dev/null
          tar -tzf ./odoo-backups/native-filestore.tar.gz

      - name: Test native copy/move restore and force protection
        working-directory: odoo-workspace
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          export POSTGRES_BIN=/usr/lib/postgresql/16/bin
          uv run odoo-compose-venv --set config:db_name=odoo_native_restore
          ./odoo-scripts/restore-db.sh ./odoo-backups/native.dump
          ./odoo-scripts/restore-filestore.sh ./odoo-backups/native-filestore.tar.gz
          copied_uuid="$(psql -d odoo_native_restore -Atqc "SELECT value FROM ir_config_parameter WHERE key='database.uuid'")"
          test -n "$copied_uuid"
          test "$copied_uuid" != test-source-identity
          test "$(cat odoo-data/filestore/odoo_native_restore/attachment)" = native-filestore-test
          if ./odoo-scripts/restore-db.sh ./odoo-backups/native.dump; then
            echo 'Database restore succeeded without --force'; exit 1
          fi
          if ./odoo-scripts/restore-filestore.sh ./odoo-backups/native-filestore.tar.gz; then
            echo 'Filestore restore succeeded without --force'; exit 1
          fi
          ./odoo-scripts/restore-db.sh ./odoo-backups/native.dump --force --move
          test "$(psql -d odoo_native_restore -Atqc "SELECT value FROM ir_config_parameter WHERE key='database.uuid'")" = test-source-identity
          ./odoo-scripts/restore-filestore.sh --force ./odoo-backups/native-filestore.tar.gz
          mkdir -p neutralize
          printf '%s\n' "SELECT 1;" > neutralize/10-first.sql
          printf '%s\n' "UPDATE ir_config_parameter SET value='neutralized' WHERE key='database.uuid';" > neutralize/20-last.sql
          ./odoo-scripts/neutralize-db.sh
          test "$(psql -d odoo_native_restore -Atqc "SELECT value FROM ir_config_parameter WHERE key='database.uuid'")" = neutralized

      - name: Test native restic filestore roundtrip
        working-directory: odoo-workspace
        env:
          RESTIC_REPOSITORY: ${{ runner.temp }}/native-restic-repo
          RESTIC_PASSWORD: native-test-password
          RESTIC_HOST: native-ci
        run: |
          export RESTIC_BIN="$(command -v restic)"
          ./odoo-scripts/restic.sh init
          ./odoo-scripts/backup-filestore-restic.sh
          uv run odoo-compose-venv --set config:db_name=odoo_native_restic
          RESTIC_SOURCE_DB_NAME=odoo_native_restore ./odoo-scripts/restore-filestore-restic.sh
          test "$(cat odoo-data/filestore/odoo_native_restic/attachment)" = native-filestore-test
          if RESTIC_SOURCE_DB_NAME=odoo_native_restore ./odoo-scripts/restore-filestore-restic.sh; then
            echo 'Restic restore succeeded without --force'; exit 1
          fi
          RESTIC_SOURCE_DB_NAME=odoo_native_restore ./odoo-scripts/restore-filestore-restic.sh --force

      - name: Test shallow Odoo branch switching against upstream Git repository
        shell: bash
        run: |
          set -euo pipefail
          repo="odoo-workspace/odoo"

          # The workspace was cloned from https://github.com/odoo/odoo.git
          # with --depth 1 --single-branch (19.0) by the provisioning step.
          test "$(git -C "$repo" remote get-url origin)" = 'https://github.com/odoo/odoo.git'
          test "$(git -C "$repo" rev-parse --is-shallow-repository)" = true
          test "$(git -C "$repo" config --get remote.origin.fetch)" = \
            '+refs/heads/19.0:refs/remotes/origin/19.0'
          git -C "$repo" show-ref --verify refs/remotes/origin/19.0
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" rev-parse origin/19.0)"

          # Switching to a branch not covered by remote.origin.fetch must
          # populate origin/18.0, not just FETCH_HEAD. This failed before the fix.
          uv run odoo-compose-venv --root ./odoo-workspace --sync-odoo \
            --set odoo:version=18.0 --set odoo:branch=18.0 --set odoo:shallow=true
          test "$(git -C "$repo" symbolic-ref --short HEAD)" = 18.0
          git -C "$repo" show-ref --verify refs/remotes/origin/18.0
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" rev-parse origin/18.0)"
          test "$(git -C "$repo" rev-parse --is-shallow-repository)" = true
          test -f "$repo/odoo-bin"
          test -z "$(git -C "$repo" status --porcelain)"

          # Switching back must still work without broadening the fetch to
          # every branch or downloading the entire history.
          uv run odoo-compose-venv --root ./odoo-workspace --sync-odoo \
            --set odoo:version=19.0 --set odoo:branch=19.0 --set odoo:shallow=true
          test "$(git -C "$repo" symbolic-ref --short HEAD)" = 19.0
          test "$(git -C "$repo" rev-parse HEAD)" = "$(git -C "$repo" rev-parse origin/19.0)"
          test "$(git -C "$repo" rev-parse --is-shallow-repository)" = true
          test "$(git -C "$repo" config --get remote.origin.fetch)" = \
            '+refs/heads/19.0:refs/remotes/origin/19.0'
          test -z "$(git -C "$repo" status --porcelain)"

      - name: Show generated workspace
        if: always()
        run: |
          echo "Workspace tree:"
          find odoo-workspace -maxdepth 2 | sort
          echo
          echo "Configs:"
          ls -la odoo-workspace/odoo-configs || true
          echo
          echo "Odoo config odoo-server.conf:"
          cat odoo-workspace/odoo-configs/odoo-server.conf || true
