name: Test Local Docker Minimal (Windows)

on:
  push:
  pull_request:

jobs:
  docker-local-minimal-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify uv
        run: uv --version

      - name: Reject unsafe addon section names on Windows
        run: |
          $invalidNames = @('..', '../outside', 'nested\repo', 'C:drive', 'repo&other')
          for ($index = 0; $index -lt $invalidNames.Count; $index++) {
            $name = $invalidNames[$index]
            $workspace = Join-Path $env:RUNNER_TEMP "ci-unsafe-addon-$index"
            New-Item -ItemType Directory -Force -Path $workspace | Out-Null
            $ini = Join-Path $workspace 'odoo-project.ini'
            @"
          [odoo]
          version = 19.0
          [addons.$name]
          repo = https://example.invalid/addon.git
          branch = 19.0
          "@ | Set-Content -LiteralPath $ini -Encoding UTF8
            $output = (& uv run odoo-compose setup --root $workspace --no-provisioning-log 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { throw "Unsafe addon name was accepted: $name" }
            if (-not $output.Contains('Invalid addon section name')) {
              throw "Unexpected rejection for addon '$name': $output"
            }
          }
          # Negative CLI checks exit with a nonzero code; reset for Actions.
          $global:LASTEXITCODE = 0

      - name: Reject unsafe Docker base_image values on Windows
        run: |
          $invalidImages = @("odoo:19`nRUN echo INJECTED", 'odoo:19 RUN echo INJECTED', 'odoo:19\RUN')
          for ($index = 0; $index -lt $invalidImages.Count; $index++) {
            $image = $invalidImages[$index]
            $workspace = Join-Path $env:RUNNER_TEMP "ci-unsafe-image-$index"
            New-Item -ItemType Directory -Force -Path $workspace | Out-Null
            $output = (& uv run odoo-compose setup --root $workspace --no-provisioning-log `
              --set "docker:base_image=$image" 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { throw "Unsafe Docker base_image was accepted: $image" }
            if (-not $output.Contains("Invalid option 'base_image' in section [docker]")) {
              throw "Unexpected rejection for image '$image': $output"
            }
            if (Test-Path (Join-Path $workspace 'docker/local/Dockerfile')) {
              throw "Dockerfile generated from invalid image '$image'"
            }
          }
          # Negative CLI checks intentionally exit nonzero; reset for Actions.
          $global:LASTEXITCODE = 0

      - name: Reject invalid Docker resource limits on Windows
        run: |
          $invalidOptions = @(
            'docker:odoo_cpus=0',
            'docker:db_cpus=-1',
            'docker:mailpit_cpus=nan',
            'docker:odoo_mem_limit=-1g',
            'docker:db_mem_limit=0',
            'docker:mailpit_mem_limit=invalid'
          )
          for ($index = 0; $index -lt $invalidOptions.Count; $index++) {
            $option = $invalidOptions[$index]
            $key = ($option -split '[:=]')[1]
            $workspace = Join-Path $env:RUNNER_TEMP "invalid-resources-$index"
            $output = (& uv run odoo-compose setup --root $workspace --no-provisioning-log `
              --set $option 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { throw "Invalid resource limit accepted: $option" }
            if (-not $output.Contains("Invalid option '$key' in section [docker]")) {
              throw "Unexpected rejection for $($option): $output"
            }
          }
          # Expected nonzero exit codes must not fail the GitHub Actions step.
          $global:LASTEXITCODE = 0

      - name: Reject invalid Docker restart policies on Windows
        run: |
          $invalidPolicies = @('', 'yes', 'false', 'on-fail', 'always; echo BAD')
          for ($index = 0; $index -lt $invalidPolicies.Count; $index++) {
            $workspace = Join-Path $env:RUNNER_TEMP "invalid-restart-$index"
            $output = (& uv run odoo-compose setup --root $workspace --no-provisioning-log `
              --set "docker:restart=$($invalidPolicies[$index])" 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { throw "Invalid restart policy was accepted." }
            if (-not $output.Contains("Invalid option 'restart' in section [docker]")) {
              throw "Unexpected restart policy validation failure: $output"
            }
          }
          $global:LASTEXITCODE = 0

      - name: Create workspace root folder
        run: New-Item -ItemType Directory -Force -Path odoo-workspace | Out-Null

      - name: Initialize project and generate default local Docker artifacts
        working-directory: ./odoo-workspace
        run: |
          uv run odoo-compose setup `
            --set odoo:version=18.0 `
            --set docker:postgres_version=18 `
            --set config:db_name=odoo_test `
            --set docker.share.exchange:source=shared/exchange `
            --set docker.share.exchange:target=/mnt/exchange

      - name: Reject unsafe database names before generating Windows restore scripts
        run: |
          $invalidNames = @('../filestore', '..\filestore', 'unsafe&name')
          for ($index = 0; $index -lt $invalidNames.Count; $index++) {
            $invalidName = $invalidNames[$index]
            $workspace = "odoo-workspace-unsafe-db-$index"
            New-Item -ItemType Directory -Force -Path $workspace | Out-Null
            Push-Location $workspace
            try {
              $output = (& uv run odoo-compose setup --set "config:db_name=$invalidName" 2>&1 | Out-String)
              if ($LASTEXITCODE -eq 0) {
                throw "Unsafe db_name was accepted: $invalidName"
              }
              if (-not $output.Contains('Invalid [config].db_name')) {
                throw "Unexpected rejection for db_name '$invalidName': $output"
              }
            } finally {
              Pop-Location
            }
          }
          # Negative CLI checks intentionally exit with a nonzero code. GitHub
          # Actions propagates pwsh's LASTEXITCODE at the end of the step.
          $global:LASTEXITCODE = 0

      - name: Check generated Windows local Docker helpers
        run: |
          $required = @()

          $scriptsDir = "odoo-workspace\docker\local\scripts"

          foreach ($name in $required) {
            $path = Join-Path $scriptsDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required Windows helper not found: $path"
            }
          }

          $unixHelpers = Get-ChildItem `
            -LiteralPath $scriptsDir `
            -Filter "*.sh" `
            -File `
            -ErrorAction SilentlyContinue

          if ($unixHelpers) {
            throw "Unix helpers must not be generated on Windows: $($unixHelpers.Name -join ', ')"
          }

          foreach ($retired in @('backup-db','restore-db','backup-filestore','restore-filestore','restic','backup-filestore-restic','restore-filestore-restic')) {
            if (Test-Path -LiteralPath (Join-Path $scriptsDir "$retired.bat")) { throw "Retired helper still generated: $retired" }
          }
          $batHelpers = Get-ChildItem -LiteralPath $scriptsDir -Filter "*.bat" -File -ErrorAction SilentlyContinue
          if ($batHelpers.Count -ne 0) {
            throw "Expected no generated .bat helpers, got $($batHelpers.Count)."
          }

          $compose = Get-Content -LiteralPath "odoo-workspace\compose.yaml" -Raw
          $sourceSha256 = (Get-FileHash -LiteralPath "odoo-workspace\odoo-project.ini" -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($expected in @(
            '# AUTO-GENERATED FILE - DO NOT EDIT MANUALLY',
            '# Generator: odoo-devops-tools (odoo-compose)',
            '# Source: odoo-project.ini',
            "# Source SHA256: $sourceSha256"
          )) {
            if (-not $compose.Contains($expected)) {
              throw "Generated Compose metadata is missing '$expected'."
            }
          }
          if ($compose -notmatch '(?m)^# Version: [0-9]+\.[0-9]+\.[0-9]+') {
            throw 'Generated Compose version header is missing.'
          }
          if ($compose -notmatch '(?m)^# Effective SHA256: [0-9a-f]{64}\r?$') {
            throw 'Generated Compose effective fingerprint is missing.'
          }
          if ($compose -notmatch '(?m)^# Generated: [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\r?$') {
            throw 'Generated Compose UTC timestamp is missing.'
          }
          foreach ($expected in @(
            'source: "./shared/exchange"',
            'target: "/mnt/exchange"',
            'create_host_path: false'
          )) {
            if ($compose -notlike "*$expected*") {
              throw "Generated Docker share configuration is missing '$expected'."
            }
          }

          if ($compose -notlike "*image: postgres:18*") {
            throw "Generated Docker Compose does not use PostgreSQL 18."
          }
          if ($compose -notmatch '(?m)^\s+- odoo-db-data:/var/lib/postgresql\s*$') {
            throw "Generated PostgreSQL 18 data volume does not use /var/lib/postgresql."
          }
          if ($compose -like "*odoo-db-data:/var/lib/postgresql/data*") {
            throw "Generated PostgreSQL 18 data volume unexpectedly uses the pre-18 data path."
          }
          foreach ($expected in @(
            'pg_isready -q -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
            'http://127.0.0.1:8069/web/login',
            'condition: service_healthy'
          )) {
            if (-not $compose.Contains($expected)) {
              throw "Generated Docker Compose healthcheck is missing '$expected'."
            }
          }
          if (([regex]::Matches($compose, '(?m)^    healthcheck:\r?$')).Count -ne 2) {
            throw 'Expected PostgreSQL and Odoo healthchecks without Mailpit.'
          }
          if ($compose -match '(?m)^    (cpus|mem_limit):') {
            throw 'Default Docker Compose must not impose resource limits.'
          }
          if (([regex]::Matches($compose, '(?m)^    restart: unless-stopped\r?$')).Count -ne 2) {
            throw 'Default Docker Compose restart policy must remain unless-stopped.'
          }

      - name: Check legacy neutralize subcommand preview
        run: |
          New-Item -ItemType Directory -Force -Path odoo-workspace-legacy\neutralize | Out-Null
          Push-Location odoo-workspace-legacy
          try {
            uv run odoo-compose setup --set odoo:version=15.0
            Set-Content -LiteralPath neutralize\10-version.sql -Value 'SELECT ${odoo:version};' -Encoding ASCII
            uv run odoo-compose neutralize --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'Legacy SQL preview failed.' }
            $preview = Get-Content -LiteralPath .odt-env\neutralize-preview\10-version.sql -Raw
            if ($preview -notlike "*E'15.0'*") { throw 'Legacy SQL reference did not resolve.' }
            if (Test-Path -LiteralPath docker\local\scripts\neutralize-db.bat) {
              throw 'Obsolete neutralization script was generated.'
            }
          } finally {
            Pop-Location
          }

      - name: Test Mailpit local Docker generation
        run: |
          New-Item -ItemType Directory -Force -Path odoo-workspace-mailpit | Out-Null
          Push-Location odoo-workspace-mailpit
          try {
            uv run odoo-compose setup `
              --set odoo:version=18.0 `
              --set docker:mailpit_enabled=true `
              --set docker:mailpit_webui_port=18025 `
              --set docker:odoo_cpus=2.0 `
              --set docker:odoo_mem_limit=4g `
              --set docker:db_cpus=1.0 `
              --set docker:db_mem_limit=2g `
              --set docker:mailpit_cpus=0.5 `
              --set docker:mailpit_mem_limit=256m `
              --set docker:restart=no `
              --set config:smtp_server=smtp.example.test `
              --set config:smtp_port=587 `
              --set config:smtp_ssl=true `
              --set config:smtp_user=test-user `
              --set config:smtp_password=test-password

            uv run odoo-compose setup --create-docker-deploy
          }
          finally {
            Pop-Location
          }

          $compose = Get-Content -LiteralPath "odoo-workspace-mailpit\compose.yaml" -Raw
          $localConf = Get-Content -LiteralPath "odoo-workspace-mailpit\docker\local\configs\odoo.conf" -Raw
          $deployConf = Get-Content -LiteralPath "odoo-workspace-mailpit\docker\deploy\configs\odoo.conf" -Raw

          foreach ($expected in @(
            "mailpit:",
            "image: ghcr.io/axllent/mailpit:v1.31.3",
            "MP_DATABASE: /data/mailpit.db",
            'MP_DISABLE_VERSION_CHECK: "true"',
            'MP_POP3_BIND_ADDR: "0.0.0.0:1110"',
            'MP_POP3_AUTH: "odoo:odoo"',
            '"18025:8025"',
            "mailpit-data:/data",
            "mailpit-data:"
          )) {
            if (-not $compose.Contains($expected)) {
              throw "Generated Mailpit Compose configuration is missing '$expected'."
            }
          }

          if (([regex]::Matches($compose, '(?m)^    restart: "no"\r?$')).Count -ne 3) {
            throw 'Docker restart=no must apply to db, odoo and mailpit.'
          }
          if (([regex]::Matches($compose, '(?m)^    healthcheck:\r?$')).Count -ne 2) {
            throw 'Expected PostgreSQL and Odoo healthchecks; Mailpit uses the image healthcheck.'
          }
          if ($compose.Contains('test: ["CMD", "/mailpit", "readyz"]') -or
              $compose -match '(?m)^      mailpit:\r?$') {
            throw 'Mailpit must use the image healthcheck and must not block Odoo startup.'
          }
          if (-not $compose.Contains('condition: service_healthy')) {
            throw 'Odoo must wait for healthy PostgreSQL.'
          }
          foreach ($resources in @(
            @{ Service = 'db'; Cpus = '1.0'; Memory = '2g' },
            @{ Service = 'odoo'; Cpus = '2.0'; Memory = '4g' },
            @{ Service = 'mailpit'; Cpus = '0.5'; Memory = '256m' }
          )) {
            $pattern = '(?ms)^  ' + $resources.Service + ':\r?\n(.*?)(?=^  (?:db|odoo|mailpit):\r?\n|^volumes:\r?\n|\z)'
            $section = [regex]::Match($compose, $pattern)
            $cpusPattern = '(?m)^    cpus: ' + [regex]::Escape($resources.Cpus) + '\r?$'
            $memoryPattern = '(?m)^    mem_limit: ' + [regex]::Escape($resources.Memory) + '\r?$'
            if (-not $section.Success -or
                $section.Groups[1].Value -notmatch $cpusPattern -or
                $section.Groups[1].Value -notmatch $memoryPattern) {
              throw "Missing resource limits for $($resources.Service)."
            }
          }

          foreach ($expected in @(
            "smtp_server = mailpit",
            "smtp_port = 1025"
          )) {
            if ($localConf -notlike "*$expected*") {
              throw "Generated local Odoo config is missing '$expected'."
            }
          }

          foreach ($unexpected in @(
            "smtp.example.test",
            "smtp_port = 587",
            "smtp_ssl = true",
            "smtp_user = test-user",
            "smtp_password = test-password"
          )) {
            if ($localConf -like "*$unexpected*") {
              throw "Mailpit local Odoo config unexpectedly contains '$unexpected'."
            }
          }

          foreach ($expected in @(
            "smtp_server = smtp.example.test",
            "smtp_port = 587",
            "smtp_ssl = true",
            "smtp_user = test-user",
            "smtp_password = test-password"
          )) {
            if ($deployConf -notlike "*$expected*") {
              throw "Deploy Odoo config did not preserve '$expected'."
            }
          }

          if ($deployConf -like "*smtp_server = mailpit*") {
            throw "Mailpit SMTP configuration leaked into deploy Odoo config."
          }

      - name: Install mock Docker command
        run: |
          $mockRoot = Join-Path $env:RUNNER_TEMP "odoo-compose-mock-docker"
          $mockProject = Join-Path $mockRoot "src"
          $mockBin = Join-Path $mockRoot "bin"

          New-Item -ItemType Directory -Force -Path $mockProject | Out-Null
          New-Item -ItemType Directory -Force -Path $mockBin | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <AssemblyName>docker</AssemblyName>
              <UseAppHost>true</UseAppHost>
            </PropertyGroup>
          </Project>
          '@ | Set-Content `
            -LiteralPath (Join-Path $mockProject "docker.csproj") `
            -Encoding UTF8

          @'
          using System;
          using System.IO;
          using System.Linq;

          internal static class Program
          {
              private static int Main(string[] args)
              {
                  var joined = string.Join(" ", args);
                  var logPath = Environment.GetEnvironmentVariable("ODT_MOCK_DOCKER_LOG");

                  if (!string.IsNullOrEmpty(logPath))
                  {
                      File.AppendAllText(logPath, joined + Environment.NewLine);
                  }

                  if (joined.Contains("psql -v ON_ERROR_STOP=1", StringComparison.Ordinal))
                  {
                      if (!joined.Contains(" -c ", StringComparison.Ordinal))
                      {
                          var stdin = Console.In.ReadToEnd();
                          if (!string.IsNullOrEmpty(logPath))
                          {
                              File.AppendAllText(
                                  logPath,
                                  "STDIN: " + stdin.Replace("\r", " ").Replace("\n", " ") + Environment.NewLine
                              );
                          }
                      }
                      return 0;
                  }

                  if (joined.Contains("SELECT datname FROM pg_database", StringComparison.Ordinal))
                  {
                      if (Environment.GetEnvironmentVariable("ODT_MOCK_DB_EXISTS") == "1")
                      {
                          Console.WriteLine(
                              Environment.GetEnvironmentVariable("ODT_MOCK_EXISTING_DB") ?? "odoo"
                          );
                      }

                      return 0;
                  }

                  if (joined.Contains("if [ -d ", StringComparison.Ordinal) &&
                      joined.Contains("/var/lib/odoo/filestore", StringComparison.Ordinal))
                  {
                      Console.WriteLine(
                          Environment.GetEnvironmentVariable("ODT_MOCK_FILESTORE_EXISTS") == "1"
                              ? "exists"
                              : "missing"
                      );
                      return 0;
                  }

                  return 0;
              }
          }
          '@ | Set-Content `
            -LiteralPath (Join-Path $mockProject "Program.cs") `
            -Encoding UTF8

          dotnet publish `
            (Join-Path $mockProject "docker.csproj") `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output $mockBin

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build mock docker.exe."
          }

          $dockerExe = Join-Path $mockBin "docker.exe"
          if (-not (Test-Path -LiteralPath $dockerExe -PathType Leaf)) {
            throw "Mock docker.exe was not generated: $dockerExe"
          }

          $mockBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test Docker run, shell, update and test subcommands
        working-directory: ./odoo-workspace
        run: |
          $env:ODT_MOCK_DOCKER_LOG = Join-Path $env:RUNNER_TEMP "run-shell-update-docker.log"

          try {
            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            & uv run odoo-compose run -i base --stop-after-init
            if ($LASTEXITCODE -ne 0) {
              throw "Docker run subcommand failed."
            }

            & uv run odoo-compose shell --no-http
            if ($LASTEXITCODE -ne 0) {
              throw "Docker shell subcommand failed."
            }

            & uv run odoo-compose update --all
            if ($LASTEXITCODE -ne 0) {
              throw "Docker update subcommand failed."
            }

            & uv run odoo-compose test -i sale --test-tags /sale
            if ($LASTEXITCODE -ne 0) {
              throw "Docker test subcommand failed."
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -notlike "*compose run --rm --no-deps odoo -- -c /etc/odoo/odoo.conf -d odoo_test -i base --stop-after-init*") {
              throw "Docker run subcommand invocation is incorrect:`n$log"
            }
            if ($log -notlike "*compose run --rm --no-deps --entrypoint odoo odoo shell -c /etc/odoo/odoo.conf -d odoo_test --no-http*") {
              throw "Docker shell subcommand invocation is incorrect:`n$log"
            }
            if ($log -notlike "*compose run --rm --no-deps -T --entrypoint click-odoo-update odoo -c /etc/odoo/odoo.conf -d odoo_test --log-level debug --update-all*") {
              throw "Docker update subcommand invocation is incorrect:`n$log"
            }
            if ($log -notlike "*compose run --rm --no-deps -T odoo -- -c /etc/odoo/odoo.conf -d odoo_test --test-enable --stop-after-init -i sale --test-tags /sale*") {
              throw "Docker test subcommand invocation is incorrect:`n$log"
            }
          }
          finally {
            Remove-Item Env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue
          }

      - name: Prepare mock restore inputs
        working-directory: ./odoo-workspace
        run: |
          New-Item -ItemType Directory -Force -Path odoo-backups | Out-Null
          Set-Content -LiteralPath .\odoo-backups\test.dump -Value "mock-database-dump" -Encoding ASCII
          Set-Content -LiteralPath .\odoo-backups\test-filestore.tar.gz -Value "mock-filestore-archive" -Encoding ASCII

      - name: Test database restore force protection
        working-directory: ./odoo-workspace
        run: |
          uv run odoo-compose setup --set config:db_name=odoo_restore
          if ($LASTEXITCODE -ne 0) { throw "Failed to configure restore target database." }
          $env:ODT_MOCK_EXISTING_DB = "odoo_restore"
          $env:ODT_MOCK_DB_EXISTS = "1"
          $env:ODT_MOCK_FILESTORE_EXISTS = "0"
          $env:ODT_MOCK_DOCKER_LOG = Join-Path $env:RUNNER_TEMP "restore-db-docker.log"

          try {
            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            $output = (uv run odoo-compose restore-db .\odoo-backups\test.dump 2>&1 | Out-String)
            $status = $LASTEXITCODE

            if ($status -eq 0) {
              throw "Database restore unexpectedly succeeded without --force."
            }

            if ($output -notlike "*target database 'odoo_restore' already exists. Use --force to replace it.*") {
              throw "Unexpected database restore error: $output"
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -match "\bdropdb\b|\bcreatedb\b|\bpg_restore\b") {
              throw "Destructive database restore command ran without --force:`n$log"
            }

            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            uv run odoo-compose restore-db --force .\odoo-backups\test.dump
            if ($LASTEXITCODE -ne 0) {
              throw "Forced database restore failed."
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            foreach ($expected in @("dropdb -U odoo --force", "createdb", "pg_restore")) {
              if ($log -notlike "*$expected*") {
                throw "Forced database restore did not call '$expected':`n$log"
              }
            }
            if ($log -notlike "*--entrypoint click-odoo odoo*") {
              throw "Default database restore did not apply --copy semantics:`n$log"
            }

            $env:ODT_MOCK_DB_EXISTS = "0"
            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            uv run odoo-compose restore-db --move .\odoo-backups\test.dump
            if ($LASTEXITCODE -ne 0) {
              throw "Restore into a missing database should not require --force."
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -like "*dropdb*") {
              throw "Restore into a missing database unexpectedly called dropdb:`n$log"
            }
            foreach ($expected in @("createdb", "pg_restore")) {
              if ($log -notlike "*$expected*") {
                throw "Restore into a missing database did not call '$expected':`n$log"
              }
            }
            if ($log -like "*--entrypoint click-odoo*") {
              throw "--move unexpectedly reset the database identity:`n$log"
            }
          }
          finally {
            Remove-Item Env:ODT_MOCK_EXISTING_DB -ErrorAction SilentlyContinue
            Remove-Item Env:ODT_MOCK_DB_EXISTS -ErrorAction SilentlyContinue
            Remove-Item Env:ODT_MOCK_FILESTORE_EXISTS -ErrorAction SilentlyContinue
            Remove-Item Env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue
          }

      - name: Test database neutralize subcommand
        run: |
          $env:ODT_MOCK_EXISTING_DB = "odoo_restore"
          $env:ODT_MOCK_DB_EXISTS = "1"
          $env:ODT_MOCK_DOCKER_LOG = Join-Path $env:RUNNER_TEMP "neutralize-db-docker.log"

          try {
            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            New-Item -ItemType Directory -Force -Path odoo-workspace\neutralize | Out-Null
            Set-Content -LiteralPath odoo-workspace\neutralize\10-first.sql -Value "SELECT 'workspace-first';" -Encoding ASCII
            Set-Content -LiteralPath odoo-workspace\neutralize\20-second.sql -Value "SELECT 'workspace-second';" -Encoding ASCII

            Push-Location odoo-workspace
            try {
              uv run odoo-compose neutralize
              if ($LASTEXITCODE -ne 0) {
                throw "Database neutralize subcommand failed."
              }
            }
            finally {
              Pop-Location
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -notlike "*--entrypoint odoo odoo neutralize*") {
              throw "Odoo 18 helper did not use native neutralization:`n$log"
            }
            $workspacePsqlCount = ([regex]::Matches(
              $log,
              [regex]::Escape("compose exec -T db psql -v ON_ERROR_STOP=1 -U odoo -d odoo_restore")
            )).Count
            if ($workspacePsqlCount -ne 2) {
              throw "Expected two workspace neutralization SQL invocations, got ${workspacePsqlCount}:`n$log"
            }
            $firstIndex = $log.IndexOf("workspace-first", [StringComparison]::Ordinal)
            $secondIndex = $log.IndexOf("workspace-second", [StringComparison]::Ordinal)
            if ($firstIndex -lt 0 -or $secondIndex -le $firstIndex) {
              throw "Workspace neutralization scripts did not run in filename order:`n$log"
            }

            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            $env:ODT_MOCK_EXISTING_DB = "odoo"
            Push-Location odoo-workspace-legacy
            try {
              uv run odoo-compose neutralize
              if ($LASTEXITCODE -ne 0) {
                throw "Legacy database neutralize subcommand failed."
              }
            }
            finally {
              Pop-Location
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            $legacyPsqlCount = ([regex]::Matches(
              $log,
              [regex]::Escape("compose exec -T db psql -v ON_ERROR_STOP=1 -U odoo -d odoo -c")
            )).Count
            if ($legacyPsqlCount -ne 3) {
              throw "Expected three legacy neutralization SQL invocations, got ${legacyPsqlCount}:`n$log"
            }
            foreach ($expected in @(
              "UPDATE ir_cron SET active = FALSE WHERE active = TRUE;",
              "UPDATE ir_mail_server SET active = FALSE WHERE active = TRUE;",
              "to_regclass('fetchmail_server')"
            )) {
              if ($log -notlike "*$expected*") {
                throw "Odoo 15 legacy neutralization did not execute '$expected':`n$log"
              }
            }
            if ($log -like "*--entrypoint click-odoo odoo*") {
              throw "Odoo 15 legacy neutralization unexpectedly used click-odoo:`n$log"
            }
          }
          finally {
            Remove-Item Env:ODT_MOCK_EXISTING_DB -ErrorAction SilentlyContinue
            Remove-Item Env:ODT_MOCK_DB_EXISTS -ErrorAction SilentlyContinue
            Remove-Item Env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue
          }

      - name: Test archive filestore restore force protection
        working-directory: ./odoo-workspace
        run: |
          $env:ODT_MOCK_DB_EXISTS = "0"
          $env:ODT_MOCK_FILESTORE_EXISTS = "1"
          $env:ODT_MOCK_DOCKER_LOG = Join-Path $env:RUNNER_TEMP "restore-filestore-docker.log"

          try {
            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            $output = (uv run odoo-compose restore-filestore .\odoo-backups\test-filestore.tar.gz 2>&1 | Out-String)
            $status = $LASTEXITCODE

            if ($status -eq 0) {
              throw "Filestore restore unexpectedly succeeded without --force."
            }

            if ($output -notlike "*target filestore for database 'odoo_restore' already exists. Use --force to replace it.*") {
              throw "Unexpected filestore restore error: $output"
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -like "*rm -rf*") {
              throw "Filestore removal ran without --force:`n$log"
            }

            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            uv run odoo-compose restore-filestore .\odoo-backups\test-filestore.tar.gz --force
            if ($LASTEXITCODE -ne 0) {
              throw "Forced filestore restore failed."
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -notlike "*rm -rf*") {
              throw "Forced filestore restore did not replace the target filestore:`n$log"
            }

            $env:ODT_MOCK_FILESTORE_EXISTS = "0"
            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            uv run odoo-compose restore-filestore .\odoo-backups\test-filestore.tar.gz
            if ($LASTEXITCODE -ne 0) {
              throw "Restore into a missing filestore should not require --force."
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -notlike "*rm -rf*") {
              throw "Filestore restore command did not run for a missing target:`n$log"
            }
          }
          finally {
            Remove-Item Env:ODT_MOCK_EXISTING_DB -ErrorAction SilentlyContinue
            Remove-Item Env:ODT_MOCK_DB_EXISTS -ErrorAction SilentlyContinue
            Remove-Item Env:ODT_MOCK_FILESTORE_EXISTS -ErrorAction SilentlyContinue
            Remove-Item Env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue
          }

      - name: Test restic filestore restore force protection
        working-directory: ./odoo-workspace
        run: |
          uv run odoo-compose setup --set config:db_name=odoo_restic_restore
          if ($LASTEXITCODE -ne 0) { throw "Failed to configure restic restore target database." }
          $env:RESTIC_SOURCE_DB_NAME = "odoo"
          $env:RESTIC_REPOSITORY = "mock:repository"
          $env:RESTIC_PASSWORD = "test-password"
          $env:RESTIC_HOST = "odoo-compose-ci"
          $env:ODT_MOCK_DB_EXISTS = "0"
          $env:ODT_MOCK_FILESTORE_EXISTS = "1"
          $env:ODT_MOCK_DOCKER_LOG = Join-Path $env:RUNNER_TEMP "restore-restic-docker.log"

          try {
            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            $output = (uv run odoo-compose restore-filestore-restic latest 2>&1 | Out-String)
            $status = $LASTEXITCODE

            if ($status -eq 0) {
              throw "Restic filestore restore unexpectedly succeeded without --force."
            }

            if ($output -notlike "*target filestore for database 'odoo_restic_restore' already exists. Use --force to replace it.*") {
              throw "Unexpected restic restore error: $output"
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -like "*rm -rf*" -or $log -like "*--entrypoint restic*") {
              throw "Restic restore progressed past protection without --force:`n$log"
            }

            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            uv run odoo-compose restore-filestore-restic latest --force
            if ($LASTEXITCODE -ne 0) {
              throw "Forced restic filestore restore failed."
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -notlike "*rm -rf*") {
              throw "Forced restic restore did not replace the target filestore:`n$log"
            }
            if ($log -notlike "*--entrypoint restic odoo restore*") {
              throw "Forced restic restore did not invoke restic restore:`n$log"
            }

            $env:ODT_MOCK_FILESTORE_EXISTS = "0"
            Remove-Item -LiteralPath $env:ODT_MOCK_DOCKER_LOG -ErrorAction SilentlyContinue

            uv run odoo-compose restore-filestore-restic
            if ($LASTEXITCODE -ne 0) {
              throw "Restic restore into a missing filestore should not require --force."
            }

            $log = Get-Content -LiteralPath $env:ODT_MOCK_DOCKER_LOG -Raw
            if ($log -notlike "*--entrypoint restic odoo restore*") {
              throw "Restic restore command did not run for a missing target:`n$log"
            }
          }
          finally {
            foreach ($name in @(
              "RESTIC_SOURCE_DB_NAME",
              "RESTIC_REPOSITORY",
              "RESTIC_PASSWORD",
              "RESTIC_HOST",
              "ODT_MOCK_EXISTING_DB",
              "ODT_MOCK_DB_EXISTS",
              "ODT_MOCK_FILESTORE_EXISTS",
              "ODT_MOCK_DOCKER_LOG"
            )) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
          }

      - name: Show generated Windows local Docker helpers
        if: always()
        run: |
          $scriptsDir = "odoo-workspace\docker\local\scripts"

          if (Test-Path -LiteralPath $scriptsDir) {
            Get-ChildItem -LiteralPath $scriptsDir -Force |
              Select-Object Name, Length

            foreach ($file in Get-ChildItem -LiteralPath $scriptsDir -Filter "*.bat" -File) {
              Write-Host ""
              Write-Host "===== $($file.Name) ====="
              Get-Content -LiteralPath $file.FullName
            }
          }
