name: Test Docker Workspace Odoo Source

on:
  push:
  pull_request:

jobs:
  docker-workspace-odoo:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify uv
        run: uv --version

      - name: Verify --set rejects unsupported Docker options
        run: |
          set +e
          output="$(uv run odt-env --init-project ./invalid-workspace \
            --set docker:not_supported=value 2>&1)"
          status=$?
          set -e

          test "${status}" -ne 0
          printf '%s\n' "${output}"
          grep -q "unsupported option 'not_supported' in section \[docker\]" <<< "${output}"

      - name: Create Odoo 19 workspace
        run: mkdir -p odoo-workspace

      - name: Generate Odoo 19 workspace Docker artifacts
        working-directory: ./odoo-workspace
        run: |
          uv run odt-env --init-project --sync-all \
            --set odoo:version=19.0 \
            --set 'virtualenv:constraints=packaging<1000' \
            --set docker:odoo_source=workspace

      - name: Check generated local Docker artifacts
        run: |
          test -d odoo-workspace/odoo/.git
          test -f odoo-workspace/odoo/odoo-bin

          test -f odoo-workspace/compose.yaml
          test -f odoo-workspace/docker/local/Dockerfile
          test -f odoo-workspace/docker/local/configs/odoo.conf
          test -f odoo-workspace/docker/local/requirements/all-requirements.in.txt
          test -f odoo-workspace/docker/local/requirements/constraints.txt
          grep -q '^packaging<1000$' \
            odoo-workspace/docker/local/requirements/constraints.txt
          ! grep -q '# --- from odoo/requirements.txt ---' \
            odoo-workspace/docker/local/requirements/all-requirements.in.txt

          grep -q '^COPY requirements/constraints.txt /tmp/constraints.txt$' \
            odoo-workspace/docker/local/Dockerfile
          grep -q -- '--constraints /tmp/constraints.txt' \
            odoo-workspace/docker/local/Dockerfile
          grep -q '^ENV PYTHONPATH=/opt/odoo$' \
            odoo-workspace/docker/local/Dockerfile
          grep -q 'exec /opt/odoo/odoo-bin' \
            odoo-workspace/docker/local/Dockerfile
          ! grep -q '^COPY .*odoo/ /opt/odoo/' \
            odoo-workspace/docker/local/Dockerfile

          grep -q '^addons_path = /opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/extra-addons$' \
            odoo-workspace/docker/local/configs/odoo.conf

          cd odoo-workspace
          docker compose config --quiet
          docker compose config | grep -q '/opt/odoo'

      - name: Build local Docker image
        working-directory: ./odoo-workspace
        run: docker compose build odoo

      - name: Verify local container uses workspace Odoo
        working-directory: ./odoo-workspace
        run: |
          docker compose run --rm --no-deps --entrypoint sh odoo -c \
            'test "$(command -v odoo)" = /usr/local/bin/odoo'

          docker compose run --rm --no-deps --entrypoint python3 odoo -c \
            'import odoo.release; assert odoo.release.__file__.startswith("/opt/odoo/"); print(odoo.release.__file__)'

      - name: Initialize Odoo 19 database
        working-directory: ./odoo-workspace
        run: |
          docker compose up -d db
          docker compose run --rm odoo \
            -- \
              -c /etc/odoo/odoo.conf \
              -d odoo \
              -i base \
              --without-demo=all \
              --stop-after-init

      - name: Generate self-contained deploy context
        working-directory: ./odoo-workspace
        run: uv run odt-env --create-docker-deploy --no-local-docker

      - name: Check generated deploy artifacts
        run: |
          test -f odoo-workspace/docker/deploy/Dockerfile
          test -f odoo-workspace/docker/deploy/odoo/odoo-bin
          test -f odoo-workspace/docker/deploy/odoo/odoo/release.py
          test -f odoo-workspace/docker/deploy/requirements/constraints.txt
          grep -q '^packaging<1000$' \
            odoo-workspace/docker/deploy/requirements/constraints.txt

          grep -q '^COPY --chown=odoo:odoo odoo/ /opt/odoo/$' \
            odoo-workspace/docker/deploy/Dockerfile
          grep -q '^ENV PYTHONPATH=/opt/odoo$' \
            odoo-workspace/docker/deploy/Dockerfile
          grep -q '^addons_path = /opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/extra-addons$' \
            odoo-workspace/docker/deploy/configs/odoo.conf

      - name: Build and verify deploy Docker image
        working-directory: ./odoo-workspace
        run: |
          docker build -t odt-env-odoo-workspace:test docker/deploy

          docker run --rm --entrypoint python3 odt-env-odoo-workspace:test -c \
            'import odoo.release; assert odoo.release.__file__.startswith("/opt/odoo/"); print(odoo.release.__file__)'

      - name: Verify explicit requirements override matching constraints
        run: |
          uv run odt-env --init-project ./constraints-workspace \
            --set odoo:version=19.0 \
            --set 'virtualenv:requirements=packaging>=1' \
            --set 'virtualenv:constraints=packaging<1'

          grep -q '^packaging>=1$' \
            constraints-workspace/docker/local/requirements/all-requirements.in.txt
          grep -Fq "skipped (overridden by explicit [virtualenv].requirements package 'packaging'): packaging<1" \
            constraints-workspace/docker/local/requirements/constraints.txt

      - name: Stop Docker Compose services
        if: always()
        working-directory: ./odoo-workspace
        run: docker compose down -v --remove-orphans

      - name: Show generated Docker workspace and config
        if: always()
        run: |
          echo "Workspace tree:"
          find odoo-workspace -maxdepth 4 | sort
          echo
          echo "Docker Compose:"
          cat odoo-workspace/compose.yaml || true
          echo
          echo "Local Dockerfile:"
          cat odoo-workspace/docker/local/Dockerfile || true
          echo
          echo "Local Docker Odoo config:"
          cat odoo-workspace/docker/local/configs/odoo.conf || true
          echo
          echo "Deploy Dockerfile:"
          cat odoo-workspace/docker/deploy/Dockerfile || true
          echo
          echo "Docker images:"
          docker images || true
          echo
          echo "Docker Compose logs:"
          cd odoo-workspace && docker compose logs --no-color || true
