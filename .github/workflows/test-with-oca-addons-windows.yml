name: Test Create Workspace With OCA Addons (Windows)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  odoo-with-oca-addons-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: odoo
          password: odoo
          database: postgres
          port: 5432
          postgres-version: "16"

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: odoo
        run: |
          psql -h 127.0.0.1 -p 5432 -U odoo -d postgres -c "SELECT version();"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify uv
        run: uv --version

      - name: Generate INI file
        run: |
          @'
          [virtualenv]
          requirements =
            psycopg2-binary==2.9.9
          requirements_ignore =
            psycopg2

          [odoo]
          version = 18.0

          [addons.oca-web]
          repo = https://github.com/OCA/web.git
          branch = ${odoo:version}

          [addons.oca-helpdesk]
          repo = https://github.com/OCA/helpdesk.git
          branch = ${odoo:version}

          [config]
          db_host = 127.0.0.1
          db_port = 5432
          db_user = odoo
          db_password = odoo
          db_name = odoo
          '@ | Set-Content -Path odoo-project.ini -Encoding UTF8

          Write-Host "Generated odoo-project.ini:"
          Get-Content odoo-project.ini

      - name: Create workspace root
        run: New-Item -ItemType Directory -Force -Path odoo-workspace | Out-Null

      - name: Provision Odoo workspace
        run: |
          uv run odoo-compose-venv .\odoo-project.ini `
            --sync-all `
            --create-venv `
            --root odoo-workspace

      - name: Check provisioning metadata
        run: |
          $manifestPath = "odoo-workspace\.odt-env\last-provisioning.json"

          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Provisioning manifest not found: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json

          if ($manifest.status -ne "success") {
            $manifest | ConvertTo-Json -Depth 20
            throw "Provisioning failed. Expected status=success, got status=$($manifest.status)"
          }

          Write-Host "Provisioning metadata OK: $manifestPath"

      - name: Check generated scripts and folders
        run: |
          $requiredPaths = @(
            "odoo-workspace\odoo-scripts\run.bat",
            "odoo-workspace\odoo-scripts\update.bat",
            "odoo-workspace\odoo-scripts\backup-db.bat",
            "odoo-workspace\odoo-scripts\restore-db.bat",
            "odoo-workspace\odoo-scripts\neutralize-db.bat",
            "odoo-workspace\odoo-scripts\backup-filestore.bat",
            "odoo-workspace\odoo-scripts\restore-filestore.bat",
            "odoo-workspace\odoo-scripts\restic.bat",
            "odoo-workspace\odoo-scripts\backup-filestore-restic.bat",
            "odoo-workspace\odoo-scripts\restore-filestore-restic.bat",
            "odoo-workspace\odoo-addons\oca-web",
            "odoo-workspace\odoo-addons\oca-helpdesk",
            "odoo-workspace\odoo-addons\oca-web\.git",
            "odoo-workspace\odoo-addons\oca-helpdesk\.git"
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required path not found: $path"
            }
          }

          if (Test-Path -LiteralPath "odoo-workspace\docker\local") {
            throw "Docker artifacts must not be generated by odoo-compose-venv."
          }

      - name: Verify native helper format
        run: |
          $nativeScripts = Get-ChildItem -LiteralPath "odoo-workspace\odoo-scripts" -Filter *.bat -File
          foreach ($script in $nativeScripts) {
            $content = Get-Content -LiteralPath $script.FullName -Raw
            if ($content -match '_backup_restore|click-odoo-backupdb|click-odoo-restoredb') {
              throw "Obsolete native helper implementation: $($script.Name)"
            }
          }

      - name: Verify native binary path validation
        working-directory: odoo-workspace
        env:
          RESTIC_REPOSITORY: ${{ runner.temp }}/native-bin-validation
          RESTIC_PASSWORD: native-test
        run: |
          $pgDump = (Get-Command pg_dump).Source
          # Use an installed executable to test the restic wrapper's path validation and argument forwarding.
          $env:RESTIC_BIN = $pgDump
          & .\odoo-scripts\restic.bat --version
          if ($LASTEXITCODE -ne 0) { throw "Restic wrapper rejected an executable file." }

          $env:RESTIC_BIN = Split-Path -Parent $pgDump
          & .\odoo-scripts\restic.bat --version
          if ($LASTEXITCODE -eq 0) { throw "Restic wrapper accepted a directory as an executable." }

          $env:RESTIC_BIN = Join-Path $env:RUNNER_TEMP "missing-restic.exe"
          & .\odoo-scripts\restic.bat --version
          if ($LASTEXITCODE -eq 0) { throw "Restic wrapper accepted a missing executable." }

          $env:POSTGRES_BIN = $pgDump
          $output = Join-Path $env:RUNNER_TEMP "invalid-native-bin.dump"
          & .\odoo-scripts\backup-db.bat $output
          if ($LASTEXITCODE -eq 0) { throw "Database backup accepted a file as POSTGRES_BIN." }

          $invalidBin = Join-Path $env:RUNNER_TEMP "native invalid bin"
          New-Item -ItemType Directory -Force -Path (Join-Path $invalidBin "pg_dump.exe") | Out-Null
          $env:POSTGRES_BIN = $invalidBin
          & .\odoo-scripts\backup-db.bat $output
          if ($LASTEXITCODE -eq 0) { throw "Database backup accepted a directory as pg_dump.exe." }
          if ((Test-Path -LiteralPath $output) -or (Test-Path -LiteralPath "$output.tmp")) {
            throw "Invalid binary paths created backup output."
          }
          $global:LASTEXITCODE = 0

      - name: Init database with OCA addons
        working-directory: odoo-workspace
        run: .\odoo-scripts\run.bat -i web_notify,helpdesk_mgmt --stop-after-init

      - name: Test native database and filestore backup/restore
        working-directory: odoo-workspace
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          psql -d odoo -v ON_ERROR_STOP=1 -c "UPDATE ir_config_parameter SET value='native-source-identity' WHERE key='database.uuid';"
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare source database." }
          New-Item -ItemType Directory -Force -Path odoo-data\filestore\odoo | Out-Null
          Set-Content -LiteralPath odoo-data\filestore\odoo\attachment -Value "native-test" -Encoding ASCII
          $env:POSTGRES_BIN = Split-Path -Parent (Get-Command pg_dump).Source
          & .\odoo-scripts\backup-db.bat .\odoo-backups\native.dump
          if ($LASTEXITCODE -ne 0) { throw "Database backup failed." }
          & .\odoo-scripts\backup-filestore.bat .\odoo-backups\native-filestore.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "Filestore backup failed." }
          uv run odoo-compose-venv ..\odoo-project.ini --root . --set config:db_name=odoo_native_restore
          if ($LASTEXITCODE -ne 0) { throw "Failed to regenerate native helpers." }
          & .\odoo-scripts\restore-db.bat .\odoo-backups\native.dump
          if ($LASTEXITCODE -ne 0) { throw "Copy restore failed." }
          $uuid = (psql -d odoo_native_restore -Atqc "SELECT value FROM ir_config_parameter WHERE key='database.uuid'" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $uuid -or $uuid -eq "native-source-identity") {
            throw "Copy restore did not regenerate database identity."
          }
          & .\odoo-scripts\restore-db.bat .\odoo-backups\native.dump
          if ($LASTEXITCODE -eq 0) { throw "Database restore succeeded without --force." }
          & .\odoo-scripts\restore-db.bat --move .\odoo-backups\native.dump --force
          if ($LASTEXITCODE -ne 0) { throw "Move restore failed." }
          $uuid = (psql -d odoo_native_restore -Atqc "SELECT value FROM ir_config_parameter WHERE key='database.uuid'" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $uuid -ne "native-source-identity") {
            throw "Move restore did not preserve database identity."
          }
          & .\odoo-scripts\restore-filestore.bat .\odoo-backups\native-filestore.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "Filestore restore failed." }
          & .\odoo-scripts\restore-filestore.bat .\odoo-backups\native-filestore.tar.gz
          if ($LASTEXITCODE -eq 0) { throw "Filestore restore succeeded without --force." }
          & .\odoo-scripts\restore-filestore.bat --force .\odoo-backups\native-filestore.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "Forced filestore restore failed." }
          $attachment = (Get-Content -LiteralPath odoo-data\filestore\odoo_native_restore\attachment -Raw).Trim()
          if ($attachment -ne "native-test") { throw "Restored filestore content is incorrect." }

      - name: Verify OCA addons installed in database
        env:
          PGPASSWORD: odoo
        run: |
          psql -h 127.0.0.1 -p 5432 -U odoo -d odoo -c @"
          SELECT name, state
          FROM ir_module_module
          WHERE name IN ('web_notify', 'helpdesk_mgmt')
          ORDER BY name;
          "@

          $missing = psql -h 127.0.0.1 -p 5432 -U odoo -d odoo -tAc @"
          SELECT string_agg(expected.name, ',')
          FROM (VALUES ('web_notify'), ('helpdesk_mgmt')) AS expected(name)
          LEFT JOIN ir_module_module module
            ON module.name = expected.name
           AND module.state = 'installed'
          WHERE module.name IS NULL;
          "@

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $missing = ($missing | Out-String).Trim()
          if ($missing) {
            throw "Modules not installed: $missing"
          }

      - name: Update addons
        working-directory: odoo-workspace
        run: .\odoo-scripts\update.bat

      - name: Show generated workspace and config
        if: always()
        run: |
          Write-Host "Workspace tree:"
          if (Test-Path -LiteralPath "odoo-workspace") {
            Get-ChildItem -LiteralPath "odoo-workspace" -Depth 2 -Force |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          }

          Write-Host ""
          Write-Host "Configs:"
          if (Test-Path -LiteralPath "odoo-workspace\odoo-configs") {
            Get-ChildItem -LiteralPath "odoo-workspace\odoo-configs" -Force
          }

          Write-Host ""
          Write-Host "Odoo config odoo-server.conf:"
          if (Test-Path -LiteralPath "odoo-workspace\odoo-configs\odoo-server.conf") {
            Get-Content -LiteralPath "odoo-workspace\odoo-configs\odoo-server.conf"
          }

          Write-Host ""
          Write-Host "Provisioning metadata:"
          if (Test-Path -LiteralPath "odoo-workspace\.odt-env") {
            Get-ChildItem -LiteralPath "odoo-workspace\.odt-env" -Recurse -File -Force |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          }

          Write-Host ""
          Write-Host "Last provisioning manifest:"
          if (Test-Path -LiteralPath "odoo-workspace\.odt-env\last-provisioning.json") {
            Get-Content -LiteralPath "odoo-workspace\.odt-env\last-provisioning.json"
          }
