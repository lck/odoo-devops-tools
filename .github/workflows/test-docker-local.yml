name: Test Local Docker Development

on:
  push:
  pull_request:

jobs:
  docker-local:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Verify uv
        run: uv --version

      - name: Create workspace root folder
        run: mkdir -p odoo-workspace

      - name: Generate local Docker workspace from project INI
        working-directory: ./odoo-workspace
        env:
          ODT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          uv run odt-env "git+https://github.com/lck/odoo-devops-tools.git//examples/odoo18-with-oca-addons-in-docker.ini?ref=${ODT_REF}" \
            --sync-addons

      - name: Check generated local Docker artifacts
        run: |
          test -d odoo-workspace/odoo-addons/oca-web/.git
          test -d odoo-workspace/odoo-addons/oca-helpdesk/.git

          test -f odoo-workspace/compose.yaml
          test -f odoo-workspace/docker/local/Dockerfile
          test -f odoo-workspace/docker/local/.dockerignore
          test -f odoo-workspace/docker/local/configs/odoo.conf
          test -f odoo-workspace/docker/local/requirements/addons-requirements.lock.txt

          test ! -e odoo-workspace/docker/local/addons
          test ! -e odoo-workspace/docker/deploy
          ! grep -q '^COPY addons/' odoo-workspace/docker/local/Dockerfile

          cd odoo-workspace
          docker compose config --quiet
          docker compose config | grep -q '/mnt/extra-addons/oca-web'
          docker compose config | grep -q '/mnt/extra-addons/oca-helpdesk'

      - name: Build local Docker image with Compose
        working-directory: ./odoo-workspace
        run: docker compose build odoo

      - name: Verify addon bind mounts
        working-directory: ./odoo-workspace
        run: |
          touch odoo-addons/oca-web/.odt-bind-mount-check
          docker compose run --rm --no-deps --entrypoint sh odoo -c \
            'test -f /mnt/extra-addons/oca-web/.odt-bind-mount-check'

      - name: Start the PostgreSQL service
        working-directory: ./odoo-workspace
        run: docker compose up -d db

      - name: Init database with bind-mounted OCA addons
        working-directory: ./odoo-workspace
        run: |
          docker compose run --rm odoo \
            -- \
            -c /etc/odoo/odoo.conf \
            -d odoo \
            -i web_notify,helpdesk_mgmt \
            --without-demo=all \
            --stop-after-init

      - name: Verify OCA addons installed in Docker database
        working-directory: ./odoo-workspace
        run: |
          docker compose exec -T db psql -U odoo -d odoo -c \
            "SELECT name, state
             FROM ir_module_module
             WHERE name IN ('web_notify', 'helpdesk_mgmt')
             ORDER BY name;"

          missing="$(docker compose exec -T db psql -U odoo -d odoo -tAc \
            "SELECT string_agg(name, ',')
             FROM ir_module_module
             WHERE name IN ('web_notify', 'helpdesk_mgmt')
               AND state <> 'installed';")"

          test -z "${missing}"

      - name: Update Odoo with click-odoo-update
        working-directory: ./odoo-workspace
        run: |
          docker compose up -d odoo
          docker compose exec -T odoo click-odoo-update \
            -c /etc/odoo/odoo.conf \
            -d odoo

      - name: Stop Docker Compose services
        if: always()
        working-directory: ./odoo-workspace
        run: docker compose down -v --remove-orphans

      - name: Show generated local Docker workspace and config
        if: always()
        run: |
          echo "Workspace tree:"
          find odoo-workspace -maxdepth 4 | sort
          echo
          echo "Docker Compose:"
          cat odoo-workspace/compose.yaml || true
          echo
          echo "Local Dockerfile:"
          cat odoo-workspace/docker/local/Dockerfile || true
          echo
          echo "Local Docker Odoo config:"
          cat odoo-workspace/docker/local/configs/odoo.conf || true
          echo
          echo "Docker images:"
          docker images || true
          echo
          echo "Docker Compose logs:"
          cd odoo-workspace && docker compose logs --no-color || true
