# Local Docker development is generated by default:
#   odt-env odoo18-with-oca-addons-in-docker.ini --sync-addons
#   docker compose up
#
# Generate the additional self-contained deploy context with:
#   odt-env odoo18-with-oca-addons-in-docker.ini --sync-addons --create-docker-deploy
#   docker build -t mycompany/odoo:18.0 docker/deploy

[odoo]
version = 18.0

[addons.oca-web]
repo = https://github.com/OCA/web.git
branch = ${odoo:version}

[addons.oca-helpdesk]
repo = https://github.com/OCA/helpdesk.git
branch = ${odoo:version}
