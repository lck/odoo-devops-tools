# odt-env reusable template.
#
# Override existing template options with --set SECTION:KEY=VALUE.
# Add or override Odoo config options with --set config:KEY=VALUE.
#
# Basic example:
#   odt-env https://github.com/lck/odoo-devops-tools/blob/main/examples/odoo-project.ini \
#     --sync-all --create-venv \
#     --set odoo:version=19.0 \
#     --set config:db_host=127.0.0.1 \
#     --set config:db_name=odoo \
#     --set config:db_user=odoo \
#     --set config:db_password=odoo
#
# Local Docker development example:
#   odt-env https://github.com/lck/odoo-devops-tools/blob/main/examples/odoo-project.ini \
#     --sync-addons \
#     --set odoo:version=19.0 \
#     --set config:http_port=18169 \
#     --set config:gevent_port=18172
#
# Deploy Docker context example:
#   odt-env https://github.com/lck/odoo-devops-tools/blob/main/examples/odoo-project.ini \
#     --sync-addons --create-docker-deploy \
#     --set odoo:version=19.0

[virtualenv]
# managed_python:
#   true  = let uv install/use a managed Python runtime.
#   false = use an already installed system Python matching python_version.
# python_version:
#   Empty value means odt-env chooses the default supported Python version for [odoo].version.
#   Set explicitly when using system Python or when you need a specific supported Python version.
#   Example: python_version = 3.11
# build_constraints:
#   Multi-line list of build-time constraints installed before wheelhouse creation.
#   Usually leave empty unless a dependency needs a constrained build tool version.
# requirements:
#   Multi-line list of extra Python packages to install or pin.
#   Packages listed here automatically take priority over the same package names
#   collected from Odoo or addon requirements.txt files.
#   Example:
#     lxml>=6
#     requests==2.32.3
#     psycopg2-binary==2.9.9
# requirements_ignore:
#   Multi-line list of packages to skip when collecting requirements from Odoo or addons.
#   Useful when replacing one distribution with another, for example psycopg2 -> psycopg2-binary.
#   Example:
#     psycopg2
managed_python = true
python_version =
build_constraints =
requirements =
requirements_ignore =

[odoo]
version = 19.0
repo = https://github.com/odoo/odoo.git
branch = ${odoo:version}
commit =
shallow = true

[docker]
base_image = odoo:${odoo:version}

[config]
# Add or override Odoo config options with --set config:KEY=VALUE.
