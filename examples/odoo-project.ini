# odoo-compose reusable template.
#
# Add or override template options with --set SECTION:KEY=VALUE.
#
# Basic example:
#   odoo-compose-venv https://github.com/lck/odoo-devops-tools/blob/main/examples/odoo-project.ini \
#     --sync-all --create-venv \
#     --set odoo:version=19.0 \
#     --set config:db_host=127.0.0.1 \
#     --set config:db_name=client_a \
#     --set config:db_user=odoo \
#     --set config:db_password=odoo
#
# Local Docker development example:
#   odoo-compose https://github.com/lck/odoo-devops-tools/blob/main/examples/odoo-project.ini \
#     --sync-addons \
#     --set odoo:version=19.0 \
#     --set config:http_port=18169 \
#     --set config:gevent_port=18172
#
# Deploy Docker context example:
#   odoo-compose https://github.com/lck/odoo-devops-tools/blob/main/examples/odoo-project.ini \
#     --sync-addons --create-docker-deploy \
#     --set odoo:version=19.0

[virtualenv]
# managed_python:
#   true  = let uv install/use a managed Python runtime.
#   false = use an already installed system Python matching python_version.
# python_version:
#   Empty value means odoo-compose chooses the default supported Python version for [odoo].version.
#   Set explicitly when using system Python or when you need a specific supported Python version.
#   Example: python_version = 3.11
# build_constraints:
#   Multi-line list of build-time constraints installed before wheelhouse creation.
#   Usually leave empty unless a dependency needs a constrained build tool version.
# constraints:
#   Multi-line list of dependency constraints used during resolution.
#   Constraints restrict versions without installing packages by themselves.
#   Packages listed in requirements take priority over matching constraints.
# requirements:
#   Multi-line list of extra Python packages to install or pin.
#   Packages listed here automatically take priority over the same package names
#   collected from Odoo or addon requirements.txt files.
#   Example:
#     lxml>=6
#     requests==2.32.3
#     psycopg2-binary==2.9.9
# requirements_ignore:
#   Multi-line list of packages to skip when collecting requirements from Odoo or addons.
#   Useful when replacing one distribution with another, for example psycopg2 -> psycopg2-binary.
#   Example:
#     psycopg2
managed_python = true
python_version =
build_constraints =
constraints =
requirements =
requirements_ignore =

[odoo]
version = 19.0
repo = https://github.com/odoo/odoo.git
branch = ${odoo:version}
commit =
shallow = true

[docker]
base_image = odoo:${odoo:version}
odoo_source = image
postgres_version = 16
restic_version = 0.19.1

# Optional Mailpit service for testing outgoing email.
mailpit_enabled = false
mailpit_version = v1.31.3
mailpit_webui_port = 8025

# Restart policy for all Compose services (Odoo, PostgreSQL, and Mailpit if enabled).
# Default: unless-stopped. Use no to avoid auto-start after a PC/Docker restart.
# Allowed: no, always, unless-stopped, on-failure.
restart = unless-stopped

# Optional per-service resource limits (unset = no explicit CPU/RAM limit).
# Uncomment only the limits you need; examples below are not defaults.
# odoo_cpus = 2.0
# odoo_mem_limit = 4g
# db_cpus = 1.0
# db_mem_limit = 2g
# mailpit_cpus = 0.5
# mailpit_mem_limit = 256m

# Optional read-write host-directory share. The source must already exist when Docker starts.
# Relative source paths are resolved from the workspace root.
# [docker.share.exchange]
# source = /srv/integration/exchange
# target = /mnt/exchange

[config]
# Add or override Odoo config options with --set config:KEY=VALUE.
